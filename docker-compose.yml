version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: blood_sanjal_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blood_sanjal_net

  redis:
    image: redis:7-alpine
    container_name: blood_sanjal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blood_sanjal_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blood_sanjal_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/blood-sanjal
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=blood_sanjal_jwt_access_super_secret_production_key_2026!
      - JWT_REFRESH_SECRET=blood_sanjal_jwt_refresh_super_secret_production_key_2026!
      - CORS_ORIGINS=*
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - blood_sanjal_net

volumes:
  mongo_data:
  redis_data:

networks:
  blood_sanjal_net:
    driver: bridge
